name: Sync with upstream
on:
  push:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Update mirror
        uses: projg2/crate-dist-mirror-action@v2
        with:
          ssh-private-key: ${{ secrets.ssh_key }}
          directories: packages/localsend_isolates/rust
          tag-filter: 'v[0-9]*'
