name: Generate flutter-deps

# Build localsend-<version>-flutter-deps.tar.xz. A manual run uploads it as a
# workflow artifact by default (safe to test); tick "publish" — or push a v<version>
# tag — to upload it to the <version> release, replacing the existing asset.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "localsend version (e.g. 1.17.0)"
        required: true
      flutter_version:
        description: "Flutter SDK version"
        required: true
        default: "3.24.5"
      publish:
        description: "Upload to the <version> release (replaces the existing asset)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: v
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "flutter=3.24.5" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "flutter=${{ inputs.flutter_version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flutter Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate bundle
        run: ./generate-flutter-deps.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.flutter }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend-${{ steps.v.outputs.version }}-flutter-deps
          path: localsend-${{ steps.v.outputs.version }}-flutter-deps.tar.xz

      - name: Publish to release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.v.outputs.version }}"
          files: localsend-${{ steps.v.outputs.version }}-flutter-deps.tar.xz
